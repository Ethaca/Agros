version: 1
target:
  start: "node app.mjs"
  cwd: "."
  readyPath: "/health"
  env: { FIXED: "0" }
seed:
  schema: "schema.sql"
  dbPath: "./data.db"
personas:
  - name: vendor1
    org: v1
    auth: { type: bearer, token: "tok-v1" }
  - name: vendor2
    org: v2
    auth: { type: bearer, token: "tok-v2" }
  - name: anonymous
    auth: { type: none }
resources:
  - id: dataset-read
    route: "GET /api/datasets/:id"
    owner: { table: datasets, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  - id: vendor-read
    route: "GET /api/vendors/:id"
    owner: { table: vendors, column: id }
    expect: { owner: allow, other: deny, anonymous: deny }
  - id: dataset-search
    route: "GET /api/datasets"
    params: [search]
    expect: { owner: allow, other: deny, anonymous: deny }
  - id: export
    route: "POST /api/export"
    safe: true
    expect: { owner: allow, other: deny, anonymous: deny }
  - id: health
    route: "GET /health"
    public: true
checks: [bola, unauth, sqli, secrets]
mode: report
