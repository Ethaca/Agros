version: 1
target:
  start: "node --no-warnings app.mjs"
  cwd: "."
  baseUrl: "http://127.0.0.1:0"
  readyPath: "/health"
  env: {}
seed:
  schema: "schema.sql"
  dbPath: "./data.db"
personas:
  - name: vendor1
    org: v1
    auth: { type: bearer, token: "tok-v1" }
  - name: vendor2
    org: v2
    auth: { type: bearer, token: "tok-v2" }
  - name: vendor3
    org: v3
    auth: { type: bearer, token: "tok-v3" }
  - name: anonymous
    auth: { type: none }
resources:
  # FLAW 1 (bola): any vendor reads any dataset
  - id: dataset-read
    route: "GET /api/datasets/:id"
    owner: { table: datasets, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  # FLAW 3 (sqli): ?search= is concatenated. List is vendor-scoped, so other vendors get 200 with their own rows.
  - id: dataset-search
    route: "GET /api/datasets?search="
    owner: { table: datasets, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  # control: correctly scoped
  - id: dataset-tasks
    route: "GET /api/datasets/:id/tasks"
    owner: { table: datasets, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  # control: correctly scoped
  - id: task-read
    route: "GET /api/tasks/:id"
    owner: { table: tasks, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  # FLAW 4 (secrets a): profile is meant to be visible to other vendors, api_key is not
  - id: vendor-profile
    route: "GET /api/vendors/:id"
    owner: { table: vendors, column: id }
    expect: { owner: allow, other: allow, anonymous: deny }
  # FLAW 2 (unauth): no auth, no scope. Body: {"datasetId": <id>}; no body exports everything.
  - id: export
    route: "POST /api/export"
    safe: true
    owner: { table: datasets, column: vendor_id }
    expect: { owner: allow, other: deny, anonymous: deny }
  # FLAW 5 (secrets b): dumps process.env
  - id: debug-env
    route: "GET /debug/env"
    expect: { owner: deny, other: deny, anonymous: deny }
  - id: health
    route: "GET /health"
    public: true
  - id: products
    route: "GET /api/products"
    public: true
checks: [bola, unauth, sqli, secrets]
secrets:
  sensitiveColumns: ["api_key", "token", "secret", "password"]
  allowOwnerSecretRead: false
  envCanaries: ["JWT_SECRET", "SECRET_KEY", "API_KEY", "STRIPE_SECRET_KEY"]
fix:
  principal: req.user.vendor_id   # caller's org inside a handler (used by `argos fix`)
mode: report
llm: { provider: anthropic, data: files }
