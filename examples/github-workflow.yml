# Argos in a customer repository: no argos.config.yaml needed.
# Copy to .github/workflows/argos.yml. Replace ARGOS_TOOL_REPO / ARGOS_TOOL_REF with the Argos repository and a pinned commit.
#
# Two jobs, two trust levels (prd/11-ci-flow.md, docs/USER_GUIDE.md "CI: 설정 없이 보고 PR 받기"):
#   prepare  runs YOUR code (build, app, optional LLM) inside Docker. Read-only token, credentials not persisted,
#            no GITHUB_TOKEN/GH_TOKEN in its environment. Output: an artifact (config draft, report, verified patch, pr.json).
#   publish  holds the write token. Downloads the artifact, validates it, pushes the argos/report-<branch> branch and
#            creates/updates ONE PR. It never checks out or builds your repository.
# Repository setting needed for publish: Settings -> Actions -> General -> Workflow permissions ->
# "Allow GitHub Actions to create and approve pull requests" (see prd/11-ci-flow.md "GitHub Actions에서 PR 권한").
name: Argos

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  prepare:
    # Recursion guard (also enforced in code): never run on Argos's own branches.
    if: ${{ !startsWith(github.head_ref, 'argos/') && !startsWith(github.ref_name, 'argos/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code under test (PR head, not the merge commit)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: app
          persist-credentials: false

      - name: Check out the Argos tool (pinned)
        uses: actions/checkout@v4
        with:
          repository: ARGOS_TOOL_REPO
          ref: ARGOS_TOOL_REF
          path: .argos-tool
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Argos tool (not your dependencies)
        run: pnpm -C .argos-tool install --frozen-lockfile

      - name: Argos prepare (runs your code in Docker; no write credential)
        # No env: GITHUB_TOKEN / GH_TOKEN are deliberately absent. prepare also drops them if present.
        run: .argos-tool/node_modules/.bin/tsx .argos-tool/src/cli.ts ci prepare --dir app --artifact argos-artifact --base "${{ github.head_ref || github.ref_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: argos-artifact
          path: argos-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    # A PR from a fork gets a read-only token: report in the prepare logs only, no branch/PR.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only the Argos tool is checked out here. The customer's repository is never checked out or built:
      # publish fetches git objects into a scratch repository without a working tree.
      - name: Check out the Argos tool (pinned)
        uses: actions/checkout@v4
        with:
          repository: ARGOS_TOOL_REPO
          ref: ARGOS_TOOL_REF
          path: .argos-tool
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Argos tool
        run: pnpm -C .argos-tool install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: argos-artifact
          path: argos-artifact

      - name: Argos publish (validate artifact, push argos/report-<branch>, create or update the PR)
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          gh auth setup-git
          .argos-tool/node_modules/.bin/tsx .argos-tool/src/cli.ts ci publish --artifact argos-artifact --repo "${{ github.repository }}"
